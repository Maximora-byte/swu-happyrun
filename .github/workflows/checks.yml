name: checks

on:
  push:
    branches: [main, "codex/**", "dot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/export_schema.py --check
      - run: uv build
      - run: uv run --no-sync python scripts/check_install.py
      - name: Checksum candidate distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Upload candidate distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
