name: checks

on:
  push:
    branches: [main, "codex/**", "dot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra server --extra agent --extra dev --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/export_schema.py --check
      - run: uv build
      - run: uv run --no-sync python scripts/check_install.py
      - name: Checksum candidate distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Upload candidate distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  console-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.19"
          python-version: "3.11"
          enable-cache: true
      - name: Install frozen browser QA dependencies
        run: uv sync --extra server --extra agent --extra dev --extra browser-test --frozen
      - name: Install official Playwright Chromium
        run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Install Chinese screenshot fonts
        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Check console JavaScript syntax and helpers
        run: node --check src/swu_happyrun/server/web/app.js && node tests/console/test_console_helpers.cjs
      - name: Exercise console with real Chromium and synthetic local data
        env:
          HAPPYRUN_EMIT_QA_SCREENSHOTS: "1"
        run: uv run --no-sync python scripts/check_console_browser.py --output-dir qa/console-browser
      - name: Upload synthetic console screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-browser-qa-${{ github.sha }}
          path: |
            qa/console-browser/desktop-1440.png
            qa/console-browser/mobile-390.png
            qa/console-browser/failure-*.png
            qa/console-browser/results.json
          if-no-files-found: error
          retention-days: 7
