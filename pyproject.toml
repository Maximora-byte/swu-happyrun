[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "swu-happyrun"
version = "0.2.0rc1"
description = "Local HappyRun workstation, task scheduler and recoverable simulation agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
swu-happyrun = "swu_happyrun.cli:main"

[project.optional-dependencies]
browser-test = ["playwright==1.62.0"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tzdata>=2025.2"]
agent = ["httpx>=0.28,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/swu_happyrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
exclude = ["**/local.properties", "**/*.keystore", "**/*.jks", "**/.gradle/**", "**/.kotlin/**", "**/build/**", "**/*.apk", "qa/**"]
